name: CI - Calidad de Codigo

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'

  pull_request:
    branches:
      - main
      - develop

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  pruebas:
    name: JUnit, JaCoCo y SonarCloud
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Permisos a Maven Wrapper
        run: chmod +x mvnw

      - name: Ejecutar JUnit y generar cobertura JaCoCo
        run: ./mvnw clean verify

      - name: Publicar reporte JaCoCo
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reporte-jacoco
          path: target/site/jacoco/
          if-no-files-found: warn

      - name: Analizar calidad con SonarCloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./mvnw org.sonarsource.scanner.maven:sonar-maven-plugin:5.2.0.4988:sonar -Dsonar.qualitygate.wait=${{ github.ref == 'refs/heads/main' }}

  docker:
    name: Build y push de imagen Docker
    needs: pruebas
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Login en GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generar etiquetas de la imagen (trazabilidad)
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Construir y publicar imagen
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Despliegue simulado con Docker Compose
    needs: docker
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'main' && 'produccion' || 'desarrollo' }}
    permissions:
      contents: read
      packages: read
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Login en GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Descargar la imagen exacta de este commit
        run: |
          docker pull $IMAGE_NAME:sha-${{ github.sha }}
          docker tag $IMAGE_NAME:sha-${{ github.sha }} msvc-ingrediente:latest

      - name: Levantar servicios con Docker Compose
        run: docker compose up -d --no-build

      - name: Prueba de humo (verificar que la API responde)
        run: |
          for i in $(seq 1 30); do
            if curl -fs http://localhost:8080/api/ingredientes; then
              echo ""
              echo "Despliegue OK - commit ${{ github.sha }}"
              exit 0
            fi
            echo "Esperando que la app levante... ($i/30)"
            sleep 5
          done
          echo "La aplicacion no respondio"
          docker compose logs
          exit 1

      - name: Bajar entorno
        if: always()
        run: docker compose down -v