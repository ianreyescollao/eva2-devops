
name: CI - Calidad de Codigo

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'

  pull_request:
    branches:
      - main
      - develop

jobs:
  pruebas:
    name: JUnit, JaCoCo y SonarCloud
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      # 1. PREPARAR ENTORNO
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Permisos a Maven Wrapper
        run: chmod +x mvnw

      # 2. PRUEBAS Y COBERTURA
      - name: Ejecutar JUnit y generar cobertura JaCoCo
        run: ./mvnw clean verify

      - name: Publicar reporte JaCoCo
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reporte-jacoco
          path: target/site/jacoco/
          if-no-files-found: warn

      # 3. ANALISIS SONARCLOUD
      - name: Analizar calidad con SonarCloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./mvnw sonar:sonar