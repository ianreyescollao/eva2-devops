services:
  msvc-ingrediente:
    build:
      context: .
      dockerfile: Dockerfile
    image: msvc-ingrediente:latest
    container_name: msvc-ingrediente
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_APPLICATION_NAME: msvc-ingrediente
      PORT: "8080"
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75.0"
    volumes:
      - h2-data:/app/data
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
        reservations:
          cpus: "0.5"
          memory: 384M

networks:
  backend:
    driver: bridge

volumes:
  h2-data: