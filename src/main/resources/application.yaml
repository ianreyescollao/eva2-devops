spring:
  application:
    name: msvc-ingrediente

  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:file:./data/ingredientesdb
    username: sa
    password: ""

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.hibernate.SQL: DEBUG
    com.zaxxer.hikari: INFO

server:
  port: ${PORT:8080}